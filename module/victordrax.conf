# VictorDrax root module configuration (simple KEY=VALUE lines, never executed).
# Default shipped with the module. On install a copy is placed at
#   /data/adb/victordrax/victordrax.conf
# Edit THAT copy; it overrides these defaults and survives module updates.

# Absolute path of the ANDRAX-NG chroot. Must match the install path in the
# VictorDrax app (Settings -> Install path). Default matches the app default.
CHROOT_PATH=/data/local/andrax

# 1 = bind-mount /dev, /dev/pts, /proc, /sys (and sdcard if enabled) at boot
# when the chroot exists. 0 = do nothing at boot (helpers still work manually).
AUTO_MOUNT=1

# 1 = bind-mount shared storage at <CHROOT_PATH>/sdcard.
MOUNT_SDCARD=1

# Source directory for the shared-storage bind mount.
SDCARD_SOURCE=/storage/emulated/0
